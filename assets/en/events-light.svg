<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" fill="none">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.ping{transform-origin:center;transform-box:fill-box;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pkt{display:none}}
</style>
<rect x="1" y="1" width="898" height="208" rx="18" fill="#f6fafb" stroke="#d3e1e8"/>
<line x1="30" y1="34" x2="30" y2="172" stroke="#d3e1e8" stroke-width="2"/>
<g>
  <circle cx="30" cy="34" r="5" fill="#d4552f" stroke="#d4552f" stroke-width="2"/>
  <circle cx="30" cy="34" r="10" stroke="#d4552f" stroke-width="1.2" class="ping"/>
  <rect x="52" y="21" width="82.0" height="26" rx="7" fill="#d4552f" opacity="0.16"/>
  <text x="93.0" y="38.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#d4552f">building</text>
  <text x="182" y="39" class="sans" font-size="15" fill="#0f1f2b">x-instagram-automation — Chrome extension for X and Instagram, with plans</text>
</g>
<g>
  <circle cx="30" cy="80" r="4" fill="#ffffff" stroke="#0d8a7b" stroke-width="2"/>
  
  <rect x="52" y="67" width="82.0" height="26" rx="7" fill="#0d8a7b" opacity="0.1"/>
  <text x="93.0" y="84.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#0d8a7b">learning</text>
  <text x="182" y="85" class="sans" font-size="15" fill="#0f1f2b">Elasticsearch, RabbitMQ and distributed systems</text>
</g>
<g>
  <circle cx="30" cy="126" r="4" fill="#ffffff" stroke="#0d8a7b" stroke-width="2"/>
  
  <rect x="52" y="113" width="52.0" height="26" rx="7" fill="#0d8a7b" opacity="0.1"/>
  <text x="78.0" y="130.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#0d8a7b">into</text>
  <text x="182" y="131" class="sans" font-size="15" fill="#0f1f2b">Clean Architecture, microservices, performance</text>
</g>
<g>
  <circle cx="30" cy="172" r="4" fill="#ffffff" stroke="#0d8a7b" stroke-width="2"/>
  
  <rect x="52" y="159" width="74.5" height="26" rx="7" fill="#0d8a7b" opacity="0.1"/>
  <text x="89.3" y="176.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#0d8a7b">offline</text>
  <text x="182" y="177" class="sans" font-size="15" fill="#0f1f2b">books and games</text>
</g>
</svg>
