name: Refresh profile README

# Pinned repolar, son commit'ler, dil dağılımı ve katkı sayıları GitHub API'den çekilir;
# README ve SVG'ler yeniden üretilir. Yalnızca bir şey değiştiyse commit atılır.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate.mjs
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate README and SVGs
        run: node generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: refresh profile data [skip ci]"
            git push
          else
            echo "No changes"
          fi
